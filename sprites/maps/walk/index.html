<title>Ash River Walkabout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* One screen: the city fills the window at an integer pixel scale; a thin HUD strip rides on top.
     Single dark look on purpose (a game screen), every colour set explicitly. */
  :root {
    --bg: #000000;
    --hud: #000000;
    --ink: #fcfcfc;
    --dim: #bcbcbc;
    --accent: #f8b800;
    --edge: #3c3c3c;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--pixel); overflow: hidden; }
  .shell { position: relative; height: 100%; display: flex; flex-direction: column; }
  .hud {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--hud); border-bottom: 2px solid var(--edge); font-size: 10px; line-height: 1.6;
  }
  .hud h1 { font-size: 12px; font-weight: 400; color: var(--accent); margin: 0; letter-spacing: 0.05em; }
  .place { color: var(--ink); min-width: 0; }
  .place b { color: var(--accent); font-weight: 400; }
  .hud label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  select, button {
    font: inherit; font-size: 10px; color: var(--ink); background: var(--bg); border: 2px solid var(--dim);
    padding: 4px 8px; border-radius: 0; cursor: pointer;
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .keys { color: var(--dim); margin-left: auto; }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; color: var(--dim); }
  .loading[hidden] { display: none; }
  @media (max-width: 640px) { .keys { display: none; } }
</style>

<div class="shell">
  <div class="hud">
    <h1 id="city">ASH RIVER</h1>
    <div class="place" id="place">Outside</div>
    <label for="who">PLAY AS <select id="who"></select></label>
    <button id="dim" type="button" aria-pressed="true" title="How much of the outside shows while you're indoors">OUTSIDE: DIM</button>
    <button id="gb" type="button" aria-pressed="false" title="Four shades of green, like the original Game Boy (G)">FILTER: OFF</button>
    <div class="keys">WASD / ARROWS · SHIFT RUN · HOLD CLICK TO WALK · G FILTER</div>
  </div>
  <div class="stage">
    <canvas id="view"></canvas>
    <div class="loading" id="loading">LOADING ASH RIVER…</div>
  </div>
</div>

<script>
(async () => {
  const T = 16;
  const load = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
  const data = await (await fetch("walk.json")).json();
  const [exterior, interior] = await Promise.all([load("exterior.png"), load("interior.png")]);
  const sheets = {};
  await Promise.all(Object.entries(data.sheets).map(async ([id, a]) => { sheets[id] = { ...a, img: await load("sheets/" + a.file) }; }));
  document.getElementById("loading").hidden = true;
  document.getElementById("city").textContent = data.name.replace(/ (.*)$/, "").toUpperCase();

  // ---- collision: one bit per 2 px block, read from the interior view (thin walls, locked doors, water, blocks) ----
  const bits = Uint8Array.from(atob(data.solid), (c) => c.charCodeAt(0));
  const W = data.w * T, H = data.h * T;
  const solidAt = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    const k = Math.floor(y / data.res) * data.cw + Math.floor(x / data.res);
    return (bits[k >> 3] >> (k & 7)) & 1;
  };
  // the feet: a 6 x 3 px box under the sprite
  const blocked = (x, y) => { for (let dy = -2; dy <= 0; dy += 2) for (let dx = -3; dx <= 3; dx += 3) if (solidAt(x + dx, y + dy)) return true; return false; };
  const buildingAt = (x, y) => data.building[Math.floor(y / T)]?.[Math.floor(x / T)] ?? -1;
  const cellsOf = new Map();
  data.building.forEach((row, y) => row.forEach((b, x) => { if (b >= 0) { if (!cellsOf.has(b)) cellsOf.set(b, []); cellsOf.get(b).push([x, y]); } }));

  // ---- people: the player plus everyone else standing where their life starts ----
  const people = data.people.filter((p) => sheets[p.sprite]).map((p) => ({ ...p, x: p.at[0] * T + 8, y: p.at[1] * T + 14, dir: "S", t: 0, moving: false }));
  const who = document.getElementById("who");
  for (const p of people.filter((q) => q.playable)) who.append(new Option(p.name, p.id));
  let me = people.find((p) => p.id === "rosa") ?? people.find((p) => p.playable);
  who.value = me.id;
  who.addEventListener("change", () => { me = people.find((p) => p.id === who.value); who.blur(); });
  let dimOutside = true;
  const dimBtn = document.getElementById("dim");
  dimBtn.addEventListener("click", () => {
    dimOutside = !dimOutside;
    dimBtn.setAttribute("aria-pressed", String(dimOutside));
    dimBtn.textContent = dimOutside ? "OUTSIDE: DIM" : "OUTSIDE: FULL";
  });

  // ---- Game Boy filter: every pixel becomes one of the DMG's four greens, by brightness ----
  const GB = [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]];
  let gb = false;
  try { gb = localStorage.getItem("walk-gb") === "1"; } catch {}
  const gbBtn = document.getElementById("gb");
  const setGb = (on) => {
    gb = on;
    gbBtn.setAttribute("aria-pressed", String(on));
    gbBtn.textContent = on ? "FILTER: GAME BOY" : "FILTER: OFF";
    try { localStorage.setItem("walk-gb", on ? "1" : "0"); } catch {}
  };
  setGb(gb);
  gbBtn.addEventListener("click", () => { setGb(!gb); gbBtn.blur(); });
  addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "g" && e.target !== who) setGb(!gb); });
  const gameBoy = (vw, vh) => {
    const img = ctx.getImageData(0, 0, vw, vh), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const c = GB[l < 70 ? 0 : l < 135 ? 1 : l < 195 ? 2 : 3];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
    ctx.putImageData(img, 0, 0);
  };

  // ---- input: keys, or hold the pointer and walk toward it ----
  const keys = new Set();
  addEventListener("keydown", (e) => { if (e.target === who) return; keys.add(e.key.toLowerCase()); if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault(); });
  addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  const canvas = document.getElementById("view"), ctx = canvas.getContext("2d");
  let pointer = null, scale = 3, cam = { x: 0, y: 0 };
  const toWorld = (e) => { const r = canvas.getBoundingClientRect(); return { x: cam.x + ((e.clientX - r.left) / r.width) * canvas.width, y: cam.y + ((e.clientY - r.top) / r.height) * canvas.height }; };
  canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); pointer = toWorld(e); });
  canvas.addEventListener("pointermove", (e) => { if (pointer) pointer = toWorld(e); });
  canvas.addEventListener("pointerup", () => (pointer = null));
  canvas.addEventListener("pointercancel", () => (pointer = null));

  const resize = () => {
    const r = canvas.getBoundingClientRect();
    scale = Math.max(2, Math.round(Math.min(r.width / 360, r.height / 240)));
    canvas.width = Math.ceil(r.width / scale);
    canvas.height = Math.ceil(r.height / scale);
    ctx.imageSmoothingEnabled = false;
  };
  addEventListener("resize", resize);
  resize();

  const DIRS = { "0,1": "S", "1,1": "SE", "1,0": "E", "1,-1": "NE", "0,-1": "N", "-1,-1": "NW", "-1,0": "W", "-1,1": "SW" };
  const place = document.getElementById("place");
  let lastPlace = "";

  function step(dt) {
    let dx = (keys.has("arrowright") || keys.has("d") ? 1 : 0) - (keys.has("arrowleft") || keys.has("a") ? 1 : 0);
    let dy = (keys.has("arrowdown") || keys.has("s") ? 1 : 0) - (keys.has("arrowup") || keys.has("w") ? 1 : 0);
    if (!dx && !dy && pointer) {
      const ax = pointer.x - me.x, ay = pointer.y - me.y, d = Math.hypot(ax, ay);
      if (d > 4) { const a = Math.atan2(ay, ax), o = Math.round(a / (Math.PI / 4)); dx = Math.round(Math.cos(o * Math.PI / 4)); dy = Math.round(Math.sin(o * Math.PI / 4)); }
    }
    me.moving = !!(dx || dy);
    if (me.moving) {
      me.dir = DIRS[`${dx},${dy}`];
      const speed = (keys.has("shift") ? 96 : 52) * dt, n = Math.hypot(dx, dy);
      const mx = (dx / n) * speed, my = (dy / n) * speed;
      // move each axis on its own so you slide along walls
      if (!blocked(me.x + mx, me.y)) me.x += mx;
      if (!blocked(me.x, me.y + my)) me.y += my;
      me.t += dt;
    } else me.t = 0;
  }

  function drawPerson(p) {
    const s = sheets[p.sprite], row = Math.max(0, s.rows.indexOf(p.dir));
    const frame = p.moving ? s.loop[Math.floor(p.t * s.fps * (keys.has("shift") && p === me ? 1.6 : 1)) % s.loop.length] : s.idle;
    const x = Math.round(p.x - s.frame.w / 2 - cam.x), y = Math.round(p.y - s.frame.h + 2 - cam.y);
    ctx.drawImage(s.img, frame * s.frame.w, row * s.frame.h, s.frame.w, s.frame.h, x, y, s.frame.w, s.frame.h);
  }

  function draw() {
    const vw = canvas.width, vh = canvas.height;
    cam.x = Math.round(Math.min(Math.max(me.x - vw / 2, 0), Math.max(0, W - vw)));
    cam.y = Math.round(Math.min(Math.max(me.y - vh / 2, 0), Math.max(0, H - vh)));
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, vw, vh);
    ctx.drawImage(exterior, cam.x, cam.y, vw, vh, 0, 0, vw, vh);
    const inside = buildingAt(me.x, me.y - 2);
    // people outside, and anyone inside the building you're in; the rest are behind roofs
    const others = people.filter((p) => p !== me && (buildingAt(p.x, p.y - 2) < 0 || buildingAt(p.x, p.y - 2) === inside));
    for (const p of others.filter((p) => buildingAt(p.x, p.y - 2) < 0).sort((a, b) => a.y - b.y)) drawPerson(p);
    if (inside >= 0) {
      // lift this building's roof: dim the street, then draw the interior over the footprint
      if (dimOutside) { ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, vw, vh); }
      for (const [x, y] of cellsOf.get(inside)) {
        const sx = x * T - cam.x, sy = y * T - cam.y;
        if (sx > -T && sy > -T && sx < vw && sy < vh) ctx.drawImage(interior, x * T, y * T, T, T, sx, sy, T, T);
      }
    }
    const front = [...others.filter((p) => inside >= 0 && buildingAt(p.x, p.y - 2) === inside), me].sort((a, b) => a.y - b.y);
    for (const p of front) drawPerson(p);
    if (gb) gameBoy(vw, vh);
    const label = inside >= 0 ? data.buildings[inside].names[0] : "Outside";
    if (label !== lastPlace) { lastPlace = label; place.innerHTML = inside >= 0 ? `INSIDE <b>${label.toUpperCase()}</b>` : "OUTSIDE"; }
  }

  let last = performance.now();
  const loop = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); draw(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})().catch((e) => { const l = document.getElementById("loading"); l.hidden = false; l.textContent = "COULDN'T LOAD THE MAP: " + e.message; });
</script>
